<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Zorven Tech IT Solutions</title>
  <link rel="icon" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #040814;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(8, 17, 36, 0.85);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 98, 227, 0.25);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: block;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    h1 span {
      color: #00C8FF;
    }
    p {
      font-size: 14px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0062E3, #00C8FF);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748B;
      margin-top: 24px;
      font-family: monospace;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-mark.png" alt="Zorven Tech" class="logo">
    <h1>You're <span>Offline</span></h1>
    <p>It looks like you've lost your internet connection. Zorven Tech will reconnect automatically once your network is restored.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div>
      <div class="status">
        <span class="dot"></span>
        <span>CACHE ACTIVE // STANDALONE PWA</span>
      </div>
    </div>
  </div>
</body>
</html>
